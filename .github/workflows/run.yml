# Datei: .github/workflows/run.yml
name: Run Python Script Every 4 Minutes

on:
  schedule:
    - cron: "*/4 * * * *"  # alle 4 Minuten
  workflow_dispatch:        # erlaubt manuelles Starten über GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Script and update log
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOKEN_ID: ${{ secrets.TOKEN_ID }}
        run: |
          echo "=== Run at $(date -u) ==="
          python alarmbot.py

          # Datei aktualisieren & committen
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add last_alert.txt
          git commit -m "Update alert state $(date -u)" || echo "No changes to commit"
          git push
