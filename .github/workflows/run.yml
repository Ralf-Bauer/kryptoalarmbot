name: Run Python Script Every 4 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"  # alle 4 Minuten
  workflow_dispatch:        # optional für manuelles Ausführen

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # Repo auschecken
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        
      # Python-Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Python-Script ausführen
      - name: Run Python Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOKEN_ID: ${{ secrets.TOKEN_ID }}
        run: |
          python alarmbot.py

      # last_alert.txt committen & pushen
      - name: Commit and push last_alert.txt
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add last_alert.txt
          git commit -m "Update alert state $(date -u)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
